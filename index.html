<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote of the Day</title>
 
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <main class="card">
    <h1 class="card-title">Quote of the day</h1>
 
    <blockquote class="quote">
      <p id="quote-text">Loading your quote...</p>
      <footer id="quote-author" class="author"></footer>
    </blockquote>
 
    <div class="actions">
      <button id="new-quote" class="btn btn-main" type="button">New quote</button>
      <button id="copy-quote" class="btn btn-outline" type="button">Copy</button>
      <a id="share-quote" class="btn btn-outline" href="#" target="_blank" rel="noopener">Share on X</a>
    </div>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
